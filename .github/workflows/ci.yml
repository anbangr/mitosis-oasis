name: CI

# Inlined CI pipeline for mitosis-oasis.
#
# This repo is public; mitosis-cicd (which hosts the reusable workflows for the
# other mitosis projects) is private. GitHub Actions refuses to resolve a
# reusable workflow from a private caller — making the cross-org workflow_call
# unusable here. Until that changes, the python-ci / docker-ghcr / deploy-ssh
# bodies are inlined below. Keep in sync manually with mitosis-cicd if those
# evolve.
#
# All jobs run on the dedicated CI droplet's `ci-oasis` runner (4 vCPU /
# 8 GB / 160 GB), which is registered against this repo with both `build`
# and `test` labels. Self-hosted to avoid GitHub Actions billed minutes.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python CI (pytest with system deps) ────────────────────────────────────
  python-ci:
    name: Python 3.10
    runs-on: [self-hosted, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config libigraph-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Production-import smoke test
        # Catches the class of bug that crashed v0.8.0 in prod (regulator.py
        # importing from test.spec_v097.conftest, which is not in the prod
        # image). Runs from /tmp to ensure ``test/`` is not implicitly on
        # sys.path via the current working directory.
        run: |
          cd /tmp
          python -c "import oasis.api" \
            && echo "OK: oasis.api imports without test/ on path" \
            || (echo "FAIL: prod-import smoke test failed — likely test/ leak"; exit 1)

      - name: Run pytest
        run: pytest --tb=short -v

  # ── Docker build + push to GHCR ───────────────────────────────────────────
  docker:
    name: Build & push Docker image
    needs: [python-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, build]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/anbangr/mitosis-oasis:latest
            ghcr.io/anbangr/mitosis-oasis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to GKE ─────────────────────────────────────────────────────────
  # OASIS runs as ClusterIP `mitosis-oasis-svc:8100` in `mitosis-prod` on the
  # GKE floor node (default-pool, e2-standard-4). The deployment is defined in
  # mitosis-prototype/k8s/prod/oasis-deployment.yaml; we only need to roll
  # the image. Mirrors mitosis-control-plane's deploy job exactly.
  #
  # An earlier attempt (PR #17 / 9cae22d) tried to skip GKE_SA_KEY by relying
  # on the runner's existing kubeconfig. That failed because the kubeconfig's
  # auth chain calls `gcloud config config-helper` + `gke-gcloud-auth-plugin`,
  # neither of which is in the runner's PATH. The clean path is to install
  # gcloud + auth on every run, same as control-plane.
  deploy:
    name: Deploy to GKE
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, build, test]
    timeout-minutes: 10
    concurrency:
      # Production rollouts must NEVER be cancelled mid-flight.
      group: deploy-mitosis-oasis
      cancel-in-progress: false
    steps:
      - name: Install kubectl
        run: |
          if ! command -v kubectl &>/dev/null; then
            KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
            curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -o root -g root -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: mitosis
          location: us-central1-a
          project_id: mitosis-cluster
      - name: Deploy new image
        run: |
          kubectl set image deployment/mitosis-oasis \
            oasis=ghcr.io/anbangr/mitosis-oasis:${{ github.sha }} \
            -n mitosis-prod
          kubectl rollout status deployment/mitosis-oasis -n mitosis-prod --timeout=180s
      - name: Health check
        run: |
          # OASIS is ClusterIP — port-forward locally and probe /api/health.
          #
          # `kubectl rollout status` above gates on the Ready condition, but
          # there is a brief race between "ReplicaSet reports Ready" and the
          # new pod's container actually accepting connections on :8000.
          # kubectl port-forward against the *service* will sometimes pick
          # the new endpoint a fraction of a second before uvicorn is bound,
          # producing a one-shot ECONNREFUSED that kills the forwarder.
          #
          # Mitigations:
          #   1. Wait for the freshly-rolled pod to be Ready (belt + suspenders
          #      on top of rollout status — also rules out the case where the
          #      old pod is still terminating when we start probing).
          #   2. Wrap port-forward + probe in an outer retry loop, so a lost
          #      forwarder gets reopened against the now-live pod.
          set -u
          kubectl -n mitosis-prod wait --for=condition=Ready pod \
            -l app=mitosis-oasis --timeout=60s

          ok=0
          for attempt in 1 2 3; do
            echo "--- health probe attempt $attempt ---"
            kubectl -n mitosis-prod port-forward svc/mitosis-oasis-svc 18100:8100 \
              > /tmp/pf.log 2>&1 &
            PF_PID=$!
            sleep 2
            for i in $(seq 1 15); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                "http://127.0.0.1:18100/api/health" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
                echo "App is up (HTTP $HTTP_CODE)"
                ok=1
                break
              fi
              sleep 2
            done
            kill "$PF_PID" 2>/dev/null || true
            wait "$PF_PID" 2>/dev/null || true
            [ "$ok" = 1 ] && break
            echo "Attempt $attempt failed, retrying (port-forward log below):"
            cat /tmp/pf.log | tail -3 || true
          done

          if [ "$ok" != 1 ]; then
            echo "Health check failed after 3 attempts"
            exit 1
          fi
