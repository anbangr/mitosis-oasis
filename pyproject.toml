[tool.poetry]
name = "mitosis-oasis"
version = "0.8.0"
description = "Open Agents Social Interaction Simulations on a Large Scale"
authors = ["CAMEL-AI.org"]
readme = "README.md"
license = "Apache License 2.0"
keywords = [
    "recommendation-system",
    "communicative-ai",
    "ai-societies",
    "social-simulations",
    "artificial-intelligence",
    "deep-learning",
    "multi-agent-systems",
    "natural-language-processing",
    "large-language-models",
]
packages = [
    { include = "oasis" },
]
repository = "https://github.com/camel-ai/oasis.git"

[tool.poetry.dependencies]
python = ">=3.10.0,<3.12"
apscheduler = "^3.10.4"
pandas = "2.2.2"
igraph = "0.11.6"
cairocffi = "1.7.1"
pytest = "8.2.0"
pytest-asyncio = "0.23.6"
tomlkit = "^0.13.0"
pillow = "10.3.0"
pre-commit = "3.7.1"
prance = "23.6.21.0"
openapi-spec-validator = "0.7.1"
slack_sdk = "3.31.0"
neo4j = "5.23.0"
fastapi = ">=0.100"
uvicorn = ">=0.20"
httpx = ">=0.24"
requests_oauthlib = "2.0.0"
pynacl = "^1.5.0"
eth-account = ">=0.10.0,<0.14.0"
base58 = "^2.1.0"
didkit = { version = "^0.3.0", optional = true }

[tool.poetry.extras]
crypto-full = ["didkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
# Exclude legacy CAMEL-AI infra tests (need social_platform schema files removed in Mitosis fork)
# and removed agent tests
norecursedirs = ["test/infra", "test/agent"]
markers = [
    "conformance: AgentCity protocol conformance replay tests",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
